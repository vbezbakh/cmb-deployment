# minikube on a laptop (see scripts/bootstrap.sh). Argo CD in the cluster tracks this file.
# image.tag/digest are updated by cmb-application CI on every merge to main.
image:
  tag: 80bef888cd45eef6e4162e8f22c1d91959a67c19
  digest: sha256:dda8c6ccc952bb2c50b451b4daa7c98626e87f7f5d941ff188c6ff311c36cc25
config:
  LOG_LEVEL: INFO
workloads:
  api:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi
    autoscaling:
      minReplicas: 2
      maxReplicas: 5
      # Locally, scale back down within a minute so the autoscale demo can be repeated.
      # Staging and prod keep the default: wait 5 minutes, then shed at most 10% per minute.
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 30
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
  webhooks:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    autoscaling:
      minReplicas: 1
      maxReplicas: 3
ingress:
  host: ""
