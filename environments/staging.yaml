# Staging: production-shaped, smaller. Auto-deployed on every merge to cmb-application main.
image:
  tag: 80bef888cd45eef6e4162e8f22c1d91959a67c19
  digest: sha256:dda8c6ccc952bb2c50b451b4daa7c98626e87f7f5d941ff188c6ff311c36cc25
externalSecret:
  enabled: true
  remoteKeys:
    DATABASE_URL: cmb-app-staging/database-url
    DATABASE_READ_URL: cmb-app-staging/database-read-url
    WEBHOOK_SIGNING_SECRET: cmb-app-staging/payments-webhook-signing-secret
workloads:
  api:
    autoscaling:
      minReplicas: 2
      maxReplicas: 6
  webhooks:
    autoscaling:
      minReplicas: 2
      maxReplicas: 3
ingress:
  host: api.staging.example.com
  tls:
    - secretName: cmb-app-staging-tls
      hosts: [api.staging.example.com]
monitoring:
  serviceMonitor:
    enabled: true
  prometheusRule:
    enabled: true
