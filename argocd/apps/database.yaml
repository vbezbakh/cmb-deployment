# Wave 1: a Postgres cluster (primary + replica) plus PgBouncer poolers, in its own namespace so the
# app reaches it like an external service. Production uses the managed database instead.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: database
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/vbezbakh/cmb-deployment.git
    targetRevision: main
    path: database/local
  destination:
    server: https://kubernetes.default.svc
    namespace: database
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
