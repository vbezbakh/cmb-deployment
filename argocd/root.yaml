# The only object applied by hand (scripts/bootstrap.sh). Everything else comes from Git:
# this "app of apps" syncs the Applications in argocd/apps/, which deploy the rest.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/vbezbakh/cmb-deployment.git
    targetRevision: main
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
