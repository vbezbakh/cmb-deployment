{{- if .Values.externalSecret.enabled }}
# Pulls DATABASE_URL etc. from the cloud secret manager into a Kubernetes Secret.
# It is a pre-install/pre-upgrade hook with a lower weight than the migration Job, so the
# Secret exists before the migration runs on the very first deploy. Orphan + Retain keep the
# Secret in place while the hook object itself is recreated on each deploy.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "cmb-app.fullname" . }}
  labels:
    {{- include "cmb-app.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    {{- toYaml .Values.externalSecret.secretStoreRef | nindent 4 }}
  target:
    name: {{ .Values.secret.name }}
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
    {{- range $key, $remote := .Values.externalSecret.remoteKeys }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $remote }}
    {{- end }}
{{- end }}
